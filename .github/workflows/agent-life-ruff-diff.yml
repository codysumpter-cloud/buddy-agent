name: Agent Life Ruff Diff

on:
  pull_request:
    paths:
      - "src/buddy_agent/agent_life/store.py"
      - ".github/workflows/agent-life-ruff-diff.yml"

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .[dev] --quiet
      - name: Print canonical Ruff import diff
        run: ruff check --select I001 --fix --diff src/buddy_agent/agent_life/store.py
