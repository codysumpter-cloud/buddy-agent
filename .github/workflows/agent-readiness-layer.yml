name: Agent readiness layer

on:
  pull_request:
    paths:
      - "src/buddy_agent/agent_readiness/**"
      - "tests/test_agent_readiness_*.py"
      - "config/sandbox-profiles.json"
      - "schemas/*economics*.json"
      - "schemas/security-evidence.schema.json"
      - "pyproject.toml"
      - ".github/workflows/agent-readiness-layer.yml"
  push:
    branches: [main]
    paths:
      - "src/buddy_agent/agent_readiness/**"
      - "tests/test_agent_readiness_*.py"
      - "config/sandbox-profiles.json"
      - "schemas/*economics*.json"
      - "schemas/security-evidence.schema.json"
      - "pyproject.toml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - name: Capture focused lint output
        id: readiness_lint
        continue-on-error: true
        run: ruff check src/buddy_agent/agent_readiness tests/test_agent_readiness_*.py > /tmp/readiness-ruff.txt 2>&1
      - name: Upload focused lint output
        if: steps.readiness_lint.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: readiness-ruff
          path: /tmp/readiness-ruff.txt
      - name: Enforce focused lint
        if: steps.readiness_lint.outcome == 'failure'
        run: |
          cat /tmp/readiness-ruff.txt
          exit 1
      - run: mypy src/buddy_agent/agent_readiness
      - run: pytest -q tests/test_agent_readiness_*.py
      - run: buddy-readiness checkpoint
