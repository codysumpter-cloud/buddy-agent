name: Agent readiness layer

on:
  pull_request:
    paths:
      - "src/buddy_agent/agent_readiness/**"
      - "tests/test_agent_readiness_*.py"
      - "config/sandbox-profiles.json"
      - "schemas/*economics*.json"
      - "schemas/security-evidence.schema.json"
      - "pyproject.toml"
      - ".github/workflows/agent-readiness-layer.yml"
  push:
    branches: [main]
    paths:
      - "src/buddy_agent/agent_readiness/**"
      - "tests/test_agent_readiness_*.py"
      - "config/sandbox-profiles.json"
      - "schemas/*economics*.json"
      - "schemas/security-evidence.schema.json"
      - "pyproject.toml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src/buddy_agent/agent_readiness tests/test_agent_readiness_*.py
      - run: mypy src/buddy_agent/agent_readiness
      - run: pytest -q tests/test_agent_readiness_*.py
      - run: buddy-readiness checkpoint
