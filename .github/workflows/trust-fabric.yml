name: Trust Fabric

on:
  push:
    paths:
      - "src/buddy_agent/trust_fabric/**"
      - "tests/test_trust_fabric.py"
      - "schemas/trust-fabric-*.json"
      - "docs/TRUST_FABRIC.md"
      - "prismtek.component.json"
      - "pyproject.toml"
      - ".github/workflows/trust-fabric.yml"
  pull_request:
    paths:
      - "src/buddy_agent/trust_fabric/**"
      - "tests/test_trust_fabric.py"
      - "schemas/trust-fabric-*.json"
      - "docs/TRUST_FABRIC.md"
      - "prismtek.component.json"
      - "pyproject.toml"
      - ".github/workflows/trust-fabric.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Compile Trust Fabric
        run: python -m py_compile src/buddy_agent/trust_fabric/*.py
      - name: Run focused tests
        run: pytest -q tests/test_trust_fabric.py
      - name: Lint focused files
        run: ruff check src/buddy_agent/trust_fabric tests/test_trust_fabric.py
